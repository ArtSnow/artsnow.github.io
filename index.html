<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#20251f">
  <title>Кто вор? — логическая игра</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <div class="eyebrow">ДЕТЕКТИВНАЯ ГОЛОВОЛОМКА</div>
        <h1>Кто вор?</h1>
      </div>
      <button id="resetBtn" class="icon-button" aria-label="Сбросить поле" title="Сбросить поле">↻</button>
    </header>

    <section class="puzzle-heading">
      <div>
        <div class="eyebrow" id="puzzleNumber">ЗАГАДКА 001</div>
        <h2 id="roomName">Гостиная</h2>
      </div>
      <select id="puzzleSelect" aria-label="Выбрать загадку"></select>
    </section>

    <section class="board-section">
      <div class="board-wrap">
        <div id="board" class="board" aria-label="Игровое поле"></div>
      </div>
      <div class="board-legend">
        <span><b class="legend-chair">●</b> кресло — место для персонажа</span>
        <span><b class="legend-cross">×</b> исключено</span>
      </div>
    </section>

    <section class="clues-panel">
      <div class="section-title-row">
        <h3>Подсказки комнаты</h3>
        <span class="small-tag">ОБЩИЕ</span>
      </div>
      <ul id="globalClues" class="global-clues"></ul>
    </section>

    <section class="people-panel">
      <div class="section-title-row">
        <h3>Персонажи</h3>
        <span class="muted" id="selectionHint">Выбери персонажа</span>
      </div>
      <div id="peopleList" class="people-list"></div>
      <div id="selectedClues" class="selected-clues" hidden></div>
    </section>

    <section class="bottom-actions">
      <button id="clearMarksBtn" class="secondary-button">Очистить мои крестики</button>
      <button id="checkBtn" class="primary-button">Проверить решение</button>
    </section>
    <div id="feedback" class="feedback" role="status" aria-live="polite"></div>
    <footer>Заметки сохраняются на этом устройстве автоматически.</footer>
  </main>
  <script src="js/config-loader.js"></script>
  <script src="js/game.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
